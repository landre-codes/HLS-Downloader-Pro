name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ testes
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt pytest ruff
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import sys
          import hlsdl
          tag = os.environ.get("GITHUB_REF_NAME", "")
          expected = f"v{hlsdl.__version__}"
          if tag != expected:
              print(f"Tag {tag} != {expected}")
              sys.exit(1)
          print(f"Versao OK: {expected}")
          PY
      - name: Qt runtime libraries (offscreen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxcb-cursor0 ffmpeg
      - name: Lint
        run: ruff check hlsdl tests main.py worker.py
      - name: QML syntax
        run: |
          output=$(pyside6-qmllint hlsdl/ui/main.qml hlsdl/ui/pages/*.qml \
            hlsdl/ui/dialogs/*.qml hlsdl/ui/components/*.qml 2>&1 || true)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eq '\[syntax\]|is not a type|Could not find property|Expected token'; then
            echo "Erro de sintaxe/tipo no QML"; exit 1
          fi
      - name: Wheel package data
        run: |
          pip wheel . --no-deps -w /tmp/wheel
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("/tmp/wheel/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "hlsdl/bridge_parts/__init__.py",
              "hlsdl/ui/pages/SinglePage.qml",
              "hlsdl/ui/pages/BatchPage.qml",
              "hlsdl/ui/components/AppButton.qml",
              "hlsdl/ui/dialogs/RecoveryDialog.qml",
              "hlsdl/ui/main.qml",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"wheel sem recursos: {missing}")
          print(f"OK: {len(names)} arquivos no wheel")
          PY
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  # ---------------------------------------------------------- testes Windows
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt pytest ruff
      - name: Lint
        run: ruff check hlsdl tests main.py worker.py
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  # ------------------------------------------------------------ build Linux
  build-linux:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt pyinstaller
      - name: Build binary (onefile para Linux)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "HLS-Downloader-Pro" \
            --add-data "hlsdl/ui:hlsdl/ui" \
            --add-data "assets/icon.ico:hlsdl/assets" \
            --add-data "assets/icon.png:hlsdl/assets" \
            --exclude-module yt_dlp \
            --noupx \
            main.py
      - name: Verify binary
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxcb-cursor0
          ls -lh dist/
          test -x dist/HLS-Downloader-Pro
          QT_QPA_PLATFORM=offscreen timeout 25 ./dist/HLS-Downloader-Pro \
            > /tmp/app.log 2>&1 || true
          if grep -qi "failed to load component\|No such file\|Traceback" /tmp/app.log; then
            echo "=== falha ao iniciar ==="; cat /tmp/app.log; exit 1
          fi
          echo "=== app rodou 25s offscreen sem erros ==="
      - name: Generate SBOM
        run: |
          python scripts/gen_sbom.py dist/sbom.json
          cp dist/sbom.json HLS-Downloader-Pro-linux-x86_64-sbom.json
      - name: Package release archive
        run: |
          chmod +x install-desktop.sh
          mkdir -p package/HLS-Downloader-Pro-linux-x86_64
          cp dist/HLS-Downloader-Pro README.md requirements.txt \
             install-desktop.sh icon.svg LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md \
             package/HLS-Downloader-Pro-linux-x86_64/
          tar -czf HLS-Downloader-Pro-linux-x86_64.tar.gz -C package .
          sha256sum HLS-Downloader-Pro-linux-x86_64.tar.gz \
            HLS-Downloader-Pro-linux-x86_64-sbom.json > SHA256SUMS-linux.txt
      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-build
          path: |
            HLS-Downloader-Pro-linux-x86_64.tar.gz
            HLS-Downloader-Pro-linux-x86_64-sbom.json
            SHA256SUMS-linux.txt
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            HLS-Downloader-Pro-linux-x86_64.tar.gz
            HLS-Downloader-Pro-linux-x86_64-sbom.json
            SHA256SUMS-linux.txt

  # ---------------------------------------------------------- build Windows
  build-windows:
    needs: [test, test-windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt pyinstaller
      - name: Generate version metadata
        run: python scripts/gen_version_info.py
      - name: Build binary (onedir + icon + version info)
        run: pyinstaller --noconfirm --clean --onedir --windowed --name "HLS-Downloader-Pro" --icon "assets/icon.ico" --version-file "build/version_info.txt" --add-data "hlsdl/ui;hlsdl/ui" --add-data "assets/icon.ico;hlsdl/assets" --add-data "assets/icon.png;hlsdl/assets" --exclude-module yt_dlp --noupx main.py
      - name: Verify binary (offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          Get-ChildItem dist\HLS-Downloader-Pro
          $exe = ".\dist\HLS-Downloader-Pro\HLS-Downloader-Pro.exe"
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardError app.err -RedirectStandardOutput app.out
          Start-Sleep -Seconds 20
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Select-String -Path app.err -Pattern "failed to load component|No such file|Traceback" -Quiet) {
            Write-Error "falha ao iniciar"; Get-Content app.err; exit 1
          }
          Write-Host "app rodou offscreen sem erros"
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = python -c "import hlsdl; print(hlsdl.__version__)"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force "dist\portable" | Out-Null
          Copy-Item -Recurse -Force "dist\HLS-Downloader-Pro" "dist\portable\HLS-Downloader-Pro"
          New-Item -ItemType File -Path "dist\portable\HLS-Downloader-Pro\portable.flag" | Out-Null
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md, CHANGELOG.md "dist\portable\HLS-Downloader-Pro\"
          Compress-Archive -Path "dist\portable\HLS-Downloader-Pro" -DestinationPath "HLS-Downloader-Pro-$version-portable-win64.zip" -Force
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = $null
          $findIscc = {
            $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ }
            foreach ($root in $roots) {
              foreach ($version in 7, 6) {
                $candidate = Join-Path $root "Inno Setup $version\ISCC.exe"
                if (Test-Path $candidate) { return $candidate }
              }
            }
            return $null
          }
          $iscc = & $findIscc
          if (-not $iscc) {
            choco install innosetup --version=6.7.1 -y --no-progress
            $iscc = & $findIscc
          }
          if (-not $iscc) { throw "Inno Setup 6/7 nao encontrado" }
          Write-Host "Inno Setup: $iscc"
          & $iscc "/DAppVersion=$env:VERSION" "installer\HLS-Downloader-Pro.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "dist\installer"
      - name: Generate SBOM
        shell: pwsh
        run: |
          python scripts/gen_sbom.py dist/sbom.json
          Copy-Item dist/sbom.json "HLS-Downloader-Pro-$env:VERSION-sbom.json"
      - name: Checksums
        shell: pwsh
        run: |
          $files = @(
            "dist\installer\HLS-Downloader-Pro-$env:VERSION-setup.exe",
            "HLS-Downloader-Pro-$env:VERSION-portable-win64.zip",
            "HLS-Downloader-Pro-$env:VERSION-sbom.json"
          )
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content "SHA256SUMS-windows.txt" -Encoding ascii
          Get-Content "SHA256SUMS-windows.txt"
      - name: Sign update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) {
            if ($env:GITHUB_REF -like "refs/tags/v*") {
              throw "segredo UPDATE_SIGNING_KEY ausente em uma release"
            }
            Write-Host "build nao-release: manifesto sem assinatura"
            exit 0
          }
          $key = Join-Path $env:RUNNER_TEMP "update_signing_key.pem"
          [IO.File]::WriteAllText($key, $env:UPDATE_SIGNING_KEY)
          try {
            python scripts/sign_release.py "SHA256SUMS-windows.txt" --key $key
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Force $key -ErrorAction SilentlyContinue
          }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build
          path: |
            dist/installer/*.exe
            HLS-Downloader-Pro-*-portable-win64.zip
            HLS-Downloader-Pro-*-sbom.json
            SHA256SUMS-windows.txt
            SHA256SUMS-windows.txt.sig
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            dist/installer/*.exe
            HLS-Downloader-Pro-*-portable-win64.zip
            HLS-Downloader-Pro-*-sbom.json
            SHA256SUMS-windows.txt
            SHA256SUMS-windows.txt.sig

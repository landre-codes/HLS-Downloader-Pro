name: Build Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "HLS-Downloader-Pro" \
            --add-data "ui.qml:." \
            --add-data "i18n.js:." \
            --collect-data PyQt6 \
            main.py

      - name: Verify binary
        run: |
          ls -lh dist/
          test -x dist/HLS-Downloader-Pro
          QT_QPA_PLATFORM=offscreen timeout 25 ./dist/HLS-Downloader-Pro \
            > /tmp/app.log 2>&1 || true
          if grep -qi "failed to load component\|No such file" /tmp/app.log; then
            echo "=== QML falhou ao carregar ==="
            cat /tmp/app.log
            exit 1
          fi
          echo "=== QML carregou sem erros (app rodou 25s offscreen) ==="

      - name: Package release archive
        run: |
          chmod +x install-desktop.sh
          mkdir -p package/HLS-Downloader-Pro-linux-x86_64
          cp dist/HLS-Downloader-Pro README.md requirements.txt \
             install-desktop.sh icon.svg package/HLS-Downloader-Pro-linux-x86_64/
          tar -czf HLS-Downloader-Pro-linux-x86_64.tar.gz -C package .

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HLS-Downloader-Pro-linux-x86_64.tar.gz
          body: |
            ## HLS Downloader Pro

            Binário Linux (x86_64) — Qt 6 embutido, não precisa de Python instalado.

            Requer **ffmpeg** e **yt-dlp** no sistema, e as libs do Qt:
            - Debian/Ubuntu: `sudo apt install ffmpeg yt-dlp libxcb-cursor0`
            - Fedora: `sudo dnf install ffmpeg yt-dlp qt6-qtbase`
            - Arch: `sudo pacman -S ffmpeg yt-dlp`

            Para rodar o binário puro:
            ```
            tar -xzf HLS-Downloader-Pro-linux-x86_64.tar.gz
            cd HLS-Downloader-Pro-linux-x86_64
            ./HLS-Downloader-Pro
            ```

            Para instalar no menu de aplicativos (atalho clicável + libs Qt):
            ```
            tar -xzf HLS-Downloader-Pro-linux-x86_64.tar.gz
            cd HLS-Downloader-Pro-linux-x86_64
            ./install-desktop.sh
            ```

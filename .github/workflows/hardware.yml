name: Hardware encoders

# Executa em runner self-hosted com a GPU/encoder correspondente.
# Requer labels no runner: self-hosted, windows, x64 e qsv.
# Rode manualmente em Actions > Hardware encoders.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  qsv-windows:
    runs-on: [self-hosted, windows, x64, qsv]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt pytest
      - name: Verify QSV encoder
        run: |
          python -c "from hlsdl.compress import detect_encoders; enc=detect_encoders(); assert 'hevc_qsv' in enc, sorted(enc); print('hevc_qsv disponivel')"
      - name: Real QSV encode
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_compress.py::test_real_qsv_encode_prefers_dedicated
